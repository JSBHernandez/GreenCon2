<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Página no encontrada - Green Consulting Ingeniería</title>
	<meta name="robots" content="noindex, nofollow">
	<link rel="canonical" href="https://greenconsultingingenieria.com/">
	<link rel="icon" type="image/png" href="images/green-mini.png">
	
	<!-- Fonts -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
	
	<style>
		:root {
			--green-primary: #0ea33a;
			--green-dark: #036c00;
			--white: #ffffff;
			--gray: #6b7280;
		}
		
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		
		body {
			font-family: 'Inter', sans-serif;
			background: linear-gradient(135deg, var(--green-dark) 0%, var(--green-primary) 100%);
			color: var(--white);
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 20px;
			text-align: center;
		}
		
		.container {
			max-width: 600px;
		}
		
		.error-code {
			font-size: 120px;
			font-weight: 700;
			line-height: 1;
			margin-bottom: 20px;
			text-shadow: 0 4px 20px rgba(0,0,0,0.3);
		}
		
		h1 {
			font-size: 32px;
			margin-bottom: 15px;
		}
		
		p {
			font-size: 18px;
			margin-bottom: 30px;
			color: rgba(255,255,255,0.9);
		}
		
		.btn {
			display: inline-block;
			padding: 15px 40px;
			background: var(--white);
			color: var(--green-dark);
			text-decoration: none;
			border-radius: 8px;
			font-weight: 600;
			font-size: 16px;
			transition: all 0.3s ease;
			box-shadow: 0 4px 15px rgba(0,0,0,0.2);
		}
		
		.btn:hover {
			transform: translateY(-2px);
			box-shadow: 0 8px 25px rgba(0,0,0,0.3);
		}
		
		.logo {
			margin-bottom: 30px;
		}
		
		.logo img {
			max-width: 180px;
			height: auto;
		}
	</style>
</head>
<body>
	<div class="container">
		<div class="logo">
			<img src="images/green-white.png" alt="Green Consulting Ingeniería">
		</div>
		<div class="error-code">404</div>
		<h1>Página no encontrada</h1>
		<p>Lo sentimos, la página que estás buscando no existe o ha sido movida.</p>
		<a href="/" class="btn">Volver al inicio</a>
	</div>
</body>
</html>
